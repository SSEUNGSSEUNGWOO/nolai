# 2차에서 배운 것 (2026-08-22):
#
# 5. **상위 개념이 같으면 안 갈린다.** 곤충/새 0.40, 학용품/장난감 0.50,
#    한식/양식 0.67. 각각 둘 다 "동물", "아이 물건", "음식"이다. 통과한 것들은
#    전부 상위 개념이 다른 쌍이었다(직업/예술, 우주/바다, 옷/가구, 몸/자연).
#
# 6. **감정은 이 방식으로 안 된다.** 3갈래 0.58, 좋은/나쁜 2갈래로 줄여도 0.75.
#    '설렘'의 이웃이 '슬픔'이다. 임베딩은 감정의 극성을 담지 않는다.
#
# 7. **probe를 통과해도 만들 이유가 되지는 않는다.** 아래 여섯은 다 통과했지만
#    레슨 1·3·5와 개념이 같아서 보류했다. 아이가 단어만 바꿔 같은 놀이를 두 번
#    하면 새로 배우는 것이 없다. probe는 "데이터가 되는가"만 잰다.
#      날씨/계절 0.83, 직업 0.88, 몸/자연 0.90 (레슨 1과 같음)
#      우주/바다 0.88, 옷/가구 0.88 (레슨 3과 같음)
#      교통/장소 0.90 (레슨 5와 같음)
#
# 8. 개념이 새로운 것을 따로 재봤다(probe로는 못 재는 종류라 손으로).
#      번역        학교↔school 0.908, 강아지↔dog 0.830 (vs cat 0.482) → 됨
#      스스로 무리  KMeans가 동물·탈것·음식을 정확히 나눔 → 됨
#      오타        강아지↔강아쥐 0.757 < 강아지↔고양이 0.790 → 안 됨
#      문맥        배(타는)↔배(먹는) 0.672 > 배(타는)↔여객선 0.636 → 안 됨
