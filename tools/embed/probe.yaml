# 레슨 후보. 만들기 전에 probe.py로 먼저 잰다. 통과한 것만 만든다.
#
# 1차에서 배운 것 (2026-08-22):
#
# 1. **임베딩은 감정의 극성을 모른다.** '신남'의 가장 가까운 이웃이 '화남'이었다.
#    기쁨/슬픔/화남 3갈래가 0.58. 감정을 갈래로 나누는 레슨은 이 방식으로 안 된다.
#
# 2. **하위 분류는 거의 안 잡힌다.** 현악/관악/타악이 0.33. 모델에게는 전부
#    "악기"다. 갈래는 아이도 한눈에 아는 큰 덩어리여야 한다.
#
# 3. **접미사가 의미를 이긴다.** 요리사↔수의사, 제빵사↔약사가 이웃이었다.
#    같은 갈래에 -사/-관/-원 같은 꼬리를 섞지 말고, 갈래끼리 꼬리가 겹치지 않게
#    단어를 고른다.
#
# 4. 갈래는 둘일 때 가장 잘 갈린다. 셋도 되지만 넷은 2D에서 한 쌍이 붙는다
#    (레슨 5에서 이미 겪었다).

