# 없는 건 못 찾아 -- 질문
#
# 문장은 passages.yaml의 것을 그대로 쓴다. 바꾸는 것은 질문뿐이다 -- 같은
# 문장 모음에 답이 있는 질문과 없는 질문을 섞어, 컴퓨터가 둘을 구별하지 못하고
# 똑같이 자신 있게 답하는 것을 보여준다.
#
# 이 레슨이 하려는 말은 "AI를 믿지 마"가 아니다. **AI는 자기가 모른다는 것을
# 모른다**는 것이다. 문구에서 이 선을 넘지 않는다.
#
# 규칙:
#
# 1. answerable(답이 있음)과 missing(답이 없음)을 섞는다. 답이 없는 질문만
#    늘어놓으면 아이가 "이 놀이는 원래 이상한 거구나"로 읽는다.
#
# 2. missing 질문은 문장 모음의 주제(동물)에서 **확실히 멀어야** 한다.
#    걸렀던 예: "비행기는 어떻게 하늘에 떠?"는 펭귄 문장(하늘로는 오르지 못한다)과
#              실제로 관련이 있어 유사도 0.592가 나왔다. 답이 있는 질문의
#              최소(0.530)보다 높아서 구별이 안 된다.
#              "공룡은 왜 다 사라졌어?"도 0.530으로 딱 겹쳐 뺐다.
#
# 3. 남긴 missing 질문은 전부 최고 유사도 0.51 이하다. 답이 있는 질문은 전부
#    0.53 이상이다. 이 간격이 레슨의 근거이므로, 질문을 고칠 때마다 다시 잰다.
#
# 4. 좌표와 유사도는 손으로 고치지 않는다. build_passages.py로 다시 만든다.

id: animal-facts-gaps
use_passages_from: passages.yaml

questions:
  # 답이 있는 것 (문장 모음 안)
  - { id: g01, text: "깜깜해진 다음에 움직이는 동물도 있어?" }
  - { id: g02, text: "물이 거의 없는 곳에서는 어떻게 견뎌?" }
  - { id: g03, text: "먹을 게 어디 있는지 친구한테 어떻게 알려줘?" }
  - { id: g04, text: "새인데 하늘을 못 나는 것도 있어?" }
  - { id: g05, text: "태어난 자리를 어떻게 다시 찾아가?" }
  - { id: g06, text: "잠이 굉장히 많은 동물은 누구야?" }
  # 답이 없는 것 (문장 모음 밖)
  - { id: g07, text: "달에는 누가 살고 있어?" }
  - { id: g08, text: "축구는 몇 명이서 해?" }
  - { id: g09, text: "김치는 어떻게 만들어?" }
  - { id: g10, text: "무지개는 왜 생겨?" }
  - { id: g11, text: "화산은 왜 터져?" }
  - { id: g12, text: "숫자는 누가 처음 만들었어?" }
