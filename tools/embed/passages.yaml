# 문장·질문 선정 규칙 (가장 가까운 걸 찾아줘)
#
# 이 데이터셋이 가르치려는 것: "검색은 똑같은 단어를 찾는 게 아니라 뜻이 가까운
# 것을 찾는 것이다." 그래서 규칙 1이 가장 중요하다.
#
# 1. 질문과 정답 문장이 같은 낱말을 쓰지 않는 짝을 반드시 여럿 넣는다.
#    낱말이 겹치면 아이는 "글자 찾기"로 읽고 아하가 사라진다.
#    의도한 짝의 예: q08(먹이가 어디 있는지 알려줘) → p11(꿀벌이 춤을 춘다)
#                    q20(태어난 곳을 다시 찾아간다) → p13(연어가 강을 거슬러 온다)
#
# 2. 문장끼리 주제가 겹치면 안 된다. 두 문장이 같은 것을 말하면 순위가 흔들리고
#    아이가 보는 1·2·3등이 실행마다 뒤집힌다.
#    걸렀던 예: 박쥐(초음파)와 돌고래(초음파)가 거의 같은 문장이 됐다.
#              → 돌고래를 빼고 고슴도치(가시)로 바꿨다.
#
# 3. 한 문장은 한 가지 사실만 담는다. 두 사실을 넣으면 임베딩이 그 사이에 놓인다.
#
# 4. 정답이 하나로 딱 떨어지지 않는 질문도 괜찮다. q01(밤에 다니는 동물)은
#    올빼미와 박쥐가 같이 올라오는데, 셋을 보여주는 놀이터에서는 오히려 자연스럽다.
#
# 검토해서 통과시킨 동점 (다시 따지지 않아도 됨):
#   q01 밤에 움직이는 동물 — 올빼미(p08)와 박쥐(p07)가 0.009 차이인데 둘 다 맞다.
#   q08 먹이 위치 알리기  — 꿀벌의 춤(p11)과 개미의 냄새길(p10)이 0.006 차이. 둘 다 맞다.
#   q12 몸 지키기         — 거북의 등딱지(p25)와 고슴도치의 가시(p29)가 0.018 차이. 둘 다 맞다.
# 답이 둘인 질문은 고치지 않는다. 화면에서 1·2등이 나란히 붙어 서는 것이 곧
# "둘 다 비슷하게 가깝다"는 사실이고, 그게 거짓이 아니다.
#
# 고쳐서 내보낸 질문:
#   q09 — "눈이 유난히 밝은"이 관용구라 모델이 해파리를 1등으로 뽑았다.
#         "아주 멀리 있는 것도 알아보는"으로 바꿔 독수리(p27)에 붙였다.
#   q11 — "자라면서 생김새가 달라지는"은 뱀의 허물·카멜레온의 색과 겹쳤고,
#         "알에서 나온 뒤에 딴 모습이"로 바꾸니 상어의 새 이빨이 1등이 됐다.
#         "날개가 없었는데 나중에 생기기도 해?"로 나비(p24)에 붙였다(격차 0.071).
#   q13 — 허브 문장인 독수리(p27)가 0.003 차이로 다람쥐와 동점이었고,
#         "나중을 위해 남겨 두는"으로 바꾸니 낙타의 혹이 1등이 됐다.
#         "가을에 주운 열매를"로 다람쥐(p20)에 붙였다(격차 0.096).
#
# 문구를 고칠 때 추상적으로 에두르면 오히려 엉뚱한 문장에 붙는다. 낱말을 겹치지
# 않게 하라는 규칙 1은 "다른 낱말로 같은 뜻"이지 "두루뭉술하게 말하기"가 아니다.
#
# 5. 각도와 유사도는 어떤 경우에도 손으로 고치지 않는다. build_passages.py로
#    다시 만든다.
#
# build_passages.py는 매 실행마다 1등과 2등의 유사도 격차가 0.02보다 작은 질문을
# "⚠ 1·2등이 거의 동점"으로 출력한다. 격차가 없는데 아이에게 1등·2등이라고
# 번호를 붙이면 노이즈를 순위로 파는 셈이기 때문이다. 하드 실패가 아니다 —
# 위 목록처럼 둘 다 정답이라 그대로 두는 게 맞는 경우도 있다.

id: animal-facts

passages:
  - { id: p01, text: "코끼리는 긴 코로 물을 빨아들인 다음 입에 넣는다." }
  - { id: p02, text: "기린은 목이 길어서 높은 나뭇가지의 잎을 뜯어 먹는다." }
  - { id: p03, text: "낙타는 등의 혹에 지방을 모아 두어 물 없이도 오래 버틴다." }
  - { id: p04, text: "북극곰은 털 속에 공기를 가둬서 얼음 위에서도 따뜻하다." }
  - { id: p05, text: "카멜레온은 주변에 맞춰 몸의 빛깔을 바꾼다." }
  - { id: p06, text: "문어는 놀라면 먹물을 뿜고 그 사이에 달아난다." }
  - { id: p07, text: "박쥐는 소리를 내보내고 돌아오는 울림으로 길을 안다." }
  - { id: p08, text: "올빼미는 해가 지고 나서야 사냥을 시작한다." }
  - { id: p09, text: "펭귄은 날개로 헤엄을 치지만 하늘로는 오르지 못한다." }
  - { id: p10, text: "개미는 지나간 자리에 냄새를 남겨 무리에게 길을 알려준다." }
  - { id: p11, text: "꿀벌은 몸을 흔드는 춤으로 꽃이 있는 방향을 동료에게 전한다." }
  - { id: p12, text: "거미는 끈끈한 줄을 쳐 놓고 걸려든 벌레를 잡는다." }
  - { id: p13, text: "연어는 바다에서 자라다가 자기가 태어난 강을 거슬러 올라온다." }
  - { id: p14, text: "상어는 이빨이 빠져도 뒤에서 새 이빨이 계속 밀려 나온다." }
  - { id: p15, text: "고래는 물속에 살지만 이따금 수면으로 올라와 숨을 쉰다." }
  - { id: p16, text: "해파리는 뼈가 하나도 없어 몸이 흐물흐물하다." }
  - { id: p17, text: "캥거루는 배에 달린 주머니에 새끼를 넣고 다닌다." }
  - { id: p18, text: "코알라는 하루의 대부분을 나무에 매달려 잠으로 보낸다." }
  - { id: p19, text: "두더지는 땅속에 굴을 파고 그 안에서 지낸다." }
  - { id: p20, text: "다람쥐는 도토리를 여기저기 묻어 두었다가 겨울에 꺼내 먹는다." }
  - { id: p21, text: "곰은 추운 계절이 오면 굴에 들어가 봄까지 자다시피 지낸다." }
  - { id: p22, text: "뱀은 자라면서 낡은 껍질을 벗어 던진다." }
  - { id: p23, text: "개구리는 꼬리 달린 올챙이로 시작해 다리가 돋아난다." }
  - { id: p24, text: "나비는 애벌레와 번데기를 거쳐 날개를 얻는다." }
  - { id: p25, text: "거북은 위험을 느끼면 단단한 등딱지 안으로 몸을 숨긴다." }
  - { id: p26, text: "치타는 짧은 거리라면 어떤 짐승보다도 빠르게 달린다." }
  - { id: p27, text: "독수리는 아주 높은 곳에서도 땅 위의 작은 먹이를 알아본다." }
  - { id: p28, text: "앵무새는 들은 소리를 그대로 흉내 내어 낸다." }
  - { id: p29, text: "고슴도치는 위험하면 몸을 둥글게 말아 가시를 세운다." }
  - { id: p30, text: "미어캣은 한 마리가 서서 망을 보며 무리에게 위험을 알린다." }

questions:
  - { id: q01, text: "깜깜해진 다음에 움직이는 동물도 있어?" }
  - { id: q02, text: "물이 거의 없는 곳에서는 어떻게 견뎌?" }
  - { id: q03, text: "얼음처럼 차가운 데 사는 동물은 안 추울까?" }
  - { id: q04, text: "몸 빛깔이 달라지는 동물이 있다던데?" }
  - { id: q05, text: "추운 계절 내내 잠만 자는 동물이 있어?" }
  - { id: q06, text: "달리기가 제일 빠른 건 누구야?" }
  - { id: q07, text: "새인데 하늘을 못 나는 것도 있어?" }
  - { id: q08, text: "먹을 게 어디 있는지 친구한테 어떻게 알려줘?" }
  - { id: q09, text: "아주 멀리 있는 것도 알아보는 동물이 있어?" }
  - { id: q10, text: "사람 목소리를 따라 하는 동물이 있어?" }
  - { id: q11, text: "날개가 없었는데 나중에 생기기도 해?" }
  - { id: q12, text: "적을 만나면 몸을 어떻게 지켜?" }
  - { id: q13, text: "가을에 주운 열매를 어디에 두었다가 먹어?" }
  - { id: q14, text: "흙 아래에서 지내는 동물도 있어?" }
  - { id: q15, text: "새끼를 데리고 다니려면 어떻게 해?" }
  - { id: q16, text: "잠이 굉장히 많은 동물은 누구야?" }
  - { id: q17, text: "바닷속에 사는데 숨은 어떻게 쉬어?" }
  - { id: q18, text: "단단한 뼈가 없는 동물도 있어?" }
  - { id: q19, text: "이가 빠지면 다시 나기도 해?" }
  - { id: q20, text: "태어난 자리를 어떻게 다시 찾아가?" }
