# 단어 실험실 사전에서 사람이 뺀 단어 (설계 문서 17장 규칙 3).
#
# 기준: 욕설·비하는 뺀다. 질병·죽음·성은 "그 단어를 아이 화면의 자동완성 목록에
# 띄워도 되는가"로 판단한다. 애매하면 남긴다 -- 사전은 배우는 말이지 금칙어가
# 아니다. 뺀 이유를 옆에 적는다.
#
# 2026-09-10 첫 검토(5,298개 전부 읽음). 남긴 경계 사례: 가난뱅이(흥부전 등 동화에
# 흔함), 난쟁이는 뺐지만 키다리·털보·코흘리개는 정감 있는 쓰임이라 남김, 오랑캐·
# 왜군은 역사 용어로 남김, 맹인·장애자·청소부는 권장 표현이 따로 있지만 비하는
# 아니라 남김. 살인자·총살·암살은 두 번째 결정에서 뺐다.
exclude:
  - 거지      # 비하어. 남에게 빌어먹는 사람
  - 거지꼴    # 거지 파생어
  - 계집아이  # 뜻풀이 자체가 "여자아이를 낮잡아 이르는 말"
  - 고자      # 생식 기관 결함을 가리키는 비하어
  - 귀머거리  # 청각 장애 비하
  - 난쟁이    # 뜻풀이가 "소인증인 사람을 낮잡아 이르는 말"
  - 도둑놈    # '놈'을 붙인 욕
  - 뚱뚱보    # 외모 놀림
  - 뚱뚱이    # 외모 놀림
  - 뚱보      # 외모 놀림. 뚱뚱이·뚱뚱보와 일관되게
  - 멍청이    # 놀림조. 바보와 같은 급
  - 바보      # 비하어
  - 바보짓    # 바보 파생어
  - 벙어리    # 언어 장애 비하
  - 병신      # 장애 비하·욕설
  - 아가리    # 입의 비속어. 욕설로 주로 쓰임
  - 앉은뱅이  # 하반신 장애 비하
  - 왜놈      # 일본인 비하
  - 장님      # 시각 장애 비하
  - 쥐새끼    # 사람을 속되게 이르는 욕
  # 2026-09-10 승우님 결정: 무거운 죽음·폭력어는 자동완성에 띄우지 않는다
  - 자살      # 무거운 죽음어
  - 살인      # 무거운 폭력어
  - 고문      # 무거운 폭력어
  - 처형      # 무거운 폭력어
  # 2026-09-10 승우님 결정 2: 죽임·시체·폭력 범죄어도 뺀다. 무덤·묘지·관·저주·욕은 남긴다
  - 살인자    # 사람을 죽인 사람
  - 총살      # 총으로 쏘아 죽임
  - 암살      # 몰래 사람을 죽임
  - 시체      # 죽은 사람의 몸
  - 시신      # 시체의 점잖은 말
  - 강도      # 폭행·협박으로 빼앗는 도둑
  - 유괴      # 사람을 속여 꾀어냄
  - 인질      # 잡아 두는 사람
  - 폭행      # 난폭한 행동
  - 폭파      # 폭발시켜 부숨
  - 학대      # 가혹하게 대우함
