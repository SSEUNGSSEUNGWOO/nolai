# AI랑 기분 맞히기 대결 -- 문장
#
# 아이가 먼저 긍정·부정을 고르고, 그다음 AI의 답을 본다. 대부분은 둘 다 맞지만
# 몇 개에서 **아이가 이긴다.** 그 순간이 이 레슨의 전부다.
#
# 쓰는 모델은 영화 감상평으로 배운 한국어 감정 분석기다. 그래서 "눈물이 나"를
# 감동으로, "안 무서웠어"를 재미없다로 본다. **무엇을 읽고 배웠는지가 답을
# 정한다** -- 컴퓨터에게 가르쳐주기(학습 데이터)의 진짜 심화이고, 임베딩으로는 시연하지 못했던
# 편향을 정직하게 보여주는 유일한 길이다.
#
# 규칙:
#
# 19. AI가 맞히는 문장을 여럿 먼저 두고, 틀리는 문장을 뒤에 둔다. 처음부터
#     틀리면 아이가 "AI는 바보구나"로 읽고 끝난다.
#
# 20. 틀리는 문장은 **왜 틀렸는지 설명할 수 있는 것만** 넣는다. 이유를 못 대면
#     그냥 오류일 뿐 배울 것이 없다.
#
# 21. 사람 기준 답(answer)은 아이 눈높이에서 이견이 없어야 한다. 애매하면 뺀다.
#     걸렀던 예: "이 영화 너무 슬퍼서 울었어" -- 감상평 문맥에서는 AI가 맞다고
#     볼 수도 있어 애매하다.
#
# 확인한 값 (2026-08-22): 20문장 중 AI가 16개 맞힘

id: feeling-duel
model_id: matthewburke/korean_sentiment
sentences:
  # AI가 맞히는 것
  - { id: f01, text: "생일 선물 받아서 기뻐",       answer: good }
  - { id: f02, text: "친구랑 놀아서 좋았어",         answer: good }
  - { id: f03, text: "강아지가 너무 귀여워",         answer: good }
  - { id: f04, text: "아이스크림 먹어서 행복해",     answer: good }
  - { id: f05, text: "칭찬 받아서 뿌듯해",           answer: good }
  - { id: f06, text: "숙제가 너무 많아",             answer: bad }
  - { id: f07, text: "넘어져서 아파",                answer: bad }
  - { id: f08, text: "장난감이 망가졌어",            answer: bad }
  - { id: f09, text: "혼나서 기분 나빠",             answer: bad }
  # AI가 틀리는 것 (이유를 댈 수 있는 것만)
  - { id: f10, text: "오늘 소풍 가서 신났어",        answer: good }
  - { id: f11, text: "너무 슬퍼서 눈물이 나",        answer: bad }
  - { id: f12, text: "하나도 안 무서웠어",           answer: good }
