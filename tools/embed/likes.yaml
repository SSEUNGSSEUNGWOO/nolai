# 내 취향을 어떻게 알까 -- 항목 (추천)
#
# 아이가 좋아하는 것을 고르면 컴퓨터가 닮은 것을 추천한다. 유튜브·넷플릭스가
# 어떻게 내 취향을 아는지를 손으로 겪게 하는 것이 목표다.
#
# words.yaml의 규칙 1~5를 그대로 지키고, 이 데이터셋에서 실제로 겪은 것을 더한다.
#
# 7. 갈래는 **셋**으로 한다.
#    넷을 넣으면 2D에서 한 쌍이 반드시 붙는다. 실제로 '애완동물'을 넣었더니
#    음식과 겹쳐 "강아지·고양이를 좋아함 → 치킨, 초콜릿 추천"이 나왔다.
#
# 8. 한 갈래 안에 성격이 다른 것을 섞지 않는다 (규칙 2의 재확인).
#    '만들기'에 피아노·바이올린을 넣었더니 악기가 '배우는 것'으로 운동 쪽에
#    붙어 "피아노·바이올린을 좋아함 → 줄넘기, 수영 추천"이 나왔다. 손으로
#    만드는 것만 남기니 27/30으로 올라갔다.
#
# 걸러낸 것:
#   치킨 - 음식이면서 동물(닭)이라 다의어다. 규칙 1 위반.
#   피아노·바이올린·앵무새·햄스터 - 위 7·8번 이유.
#
# 지금 상태: 같은 갈래 추천 27/30. 남은 셋은 2D 투영 잡음이고(십자수가 피자
# 근처, 초콜릿이 수영 근처), 아이에겐 "가끔 엉뚱한 것도 섞인다"로 읽혀 오히려
# 추천의 성격을 보여준다.

# 검토해서 통과시킨 이웃 경고 (다시 따지지 않아도 됨):
#   줄넘기   - 이웃이 그림 그리기·블록 쌓기로 나온다. 둘 다 "혼자 반복해서 하는"
#              것이라 모델이 가깝게 본 듯하다. 추천에 섞여도 아이에게 이상하지 않다.
#   십자수   - 이웃에 피자·떡볶이가 낀다. 2D 투영 잡음이다. 화면에서 추천 3개 중
#              하나가 엉뚱하게 나오는 정도이고, 그게 추천의 성격이기도 하다.
#   블록 쌓기 - 줄넘기·수영이 이웃이다. 위와 같은 이유.
#
# 셋 다 그대로 둔다. 이 레슨은 "완벽한 추천"이 아니라 "닮은 것을 골라준다"를
# 가르치므로, 가끔 섞이는 것이 오히려 사실에 가깝다.

