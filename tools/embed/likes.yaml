# 내 취향을 어떻게 알까 -- 항목 (추천)
#
# 아이가 좋아하는 것을 고르면 컴퓨터가 닮은 것을 추천한다. 유튜브·넷플릭스가
# 어떻게 내 취향을 아는지를 손으로 겪게 하는 것이 목표다.
#
# words.yaml의 규칙 1~5를 그대로 지키고, 이 데이터셋에서 실제로 겪은 것을 더한다.
#
# 7. 갈래는 **셋**으로 한다.
#    넷을 넣으면 2D에서 한 쌍이 반드시 붙는다. 실제로 '애완동물'을 넣었더니
#    음식과 겹쳐 "강아지·고양이를 좋아함 → 치킨, 초콜릿 추천"이 나왔다.
#
# 8. 한 갈래 안에 성격이 다른 것을 섞지 않는다 (규칙 2의 재확인).
#    '만들기'에 피아노·바이올린을 넣었더니 악기가 '배우는 것'으로 운동 쪽에
#    붙어 "피아노·바이올린을 좋아함 → 줄넘기, 수영 추천"이 나왔다. 손으로
#    만드는 것만 남기니 27/30으로 올라갔다.
#
# 걸러낸 것:
#   치킨 - 음식이면서 동물(닭)이라 다의어다. 규칙 1 위반.
#   피아노·바이올린·앵무새·햄스터 - 위 7·8번 이유.
#
# 9. 2D에서 엉뚱한 이웃이 보이면 고차원부터 잰다. 투영 잡음이라고 넘기지 않는다.
#    "피자 → 십자수 추천"을 2D 투영 잡음으로 적어두고 넘겼는데, 고차원을 재보니
#    거기가 더 나빴다(최근접 3개 같은 갈래 56/72). 범인은 줄넘기(만들기 항목 9개와
#    서로 최근접 -- "혼자 반복하는 것"으로 묶이는 듯)와 스케이트(아이스크림·초콜릿과
#    가까움). 둘을 탁구·배구로 바꾸니 70/72. 피자→십자수는 이 둘이 투영을 비튼
#    부수 효과였다. 2026-08-24.
#
#    십자수도 2D에서 아이스크림·피자를 끌어와 퍼즐 맞추기로 바꿨다(71/72).
#
# 지금 상태: 고차원 최근접 3개 같은 갈래 71/72. 남은 하나(레고→피자)는 더 손대면
# 과적합이라 둔다.

