# 레슨 14용 이야기 (다음 말 맞히기 = 생성형 AI 원리)
#
# ChatGPT가 글을 쓰는 방식을 아이 눈높이로 그대로 보여준다. 앞말 다음에 무엇이
# 왔는지 세어두고, 아이가 한 단어씩 골라 문장을 만든다. **아이가 곧 모델이 된다.**
#
# 규칙:
#
# 16. 같은 앞말 뒤에 **여러 가지가 오도록** 문장을 짠다. 하나뿐이면 고를 것이
#     없어 놀이가 안 된다. '나는' 뒤에 네 가지가 오게 하는 식이다.
#
# 17. 아이가 아는 이야기와 일상 문장만 쓴다. 읽을 수 있어야 고를 수 있다.
#
# 18. **이야기 수가 적은 것이 오히려 교육적이다.** ChatGPT는 인터넷을 다 읽었고
#     우리는 문장 마흔 개를 읽었다. 그 차이를 아이가 체감하는 것이 name 스텝이다.
#
# 확률은 이 문장들에서 실제로 센 값이다. 손으로 고치지 않는다.

