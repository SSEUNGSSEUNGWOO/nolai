# 단어 선정 규칙 (레슨을 늘릴 때 반드시 지킬 것)
#
# 1. 다의어 금지. 임베딩은 뜻으로 모으는데 뜻이 여러 개면 모델이 그 사이에 놓는다.
#    걸렸던 예: 배(ship/pear/belly), 사과(apple/apology), 새(bird/new)
#
# 2. 카테고리는 '사람이 묶은 분류'가 아니라 '의미적으로 가까운 것끼리'여야 한다.
#    걸렸던 예: '먹을 것'은 생과일과 가공 디저트가 섞여 두 덩이로 쪼개졌다.
#    → '과일'로 좁히니 하나의 무리가 됐다.
#
# 3. 바꾼 뒤에는 반드시 클러스터 품질을 숫자로 재검증한다.
#    좌표는 어떤 경우에도 손으로 고치지 않는다.
#
# 검토해서 통과시킨 경계 사례 (다시 따지지 않아도 됨):
#   병아리 — '초보자'라는 비유적 뜻이 있으나 실제 이웃은 호랑이·물고기·코끼리로
#            동물 무리에 정확히 붙는다
#   포도   — 사어가 된 동음이의어 捕盜(포도청)가 있고, k=3 이웃 검사가 실제로
#            "카테고리 확인 필요"로 잡는다(이웃이 귤·트럭·자전거라 다수가 vehicle).
#            그런데 아이가 보는 건 이웃 순위가 아니라 '선이 그어지는가'다.
#            LINK_THRESHOLD가 0.22인데 포도-귤은 0.1915(선 있음),
#            포도-트럭은 0.3156, 포도-자전거는 0.3354로 둘 다 임계값 밖이다.
#            즉 화면에서 포도는 과일하고만 이어진다. 데이터셋 전체의
#            카테고리 교차 선은 0개다. 그대로 둔다.
#
# 규칙 1이 막으려는 건 '뜻이 갈려 모델이 중간에 놓는 것'이지 사전적 중의성 자체가
# 아니다. 애매하면 바꾸지 말고 먼저 실제 이웃을 찍어보고 판단할 것.
#
# build_dataset.py는 매 실행마다 단어별 2D 최근접 이웃 3개를 보고, 이웃 다수의
# 카테고리와 표시된 카테고리가 다른 단어를 "⚠ 카테고리 확인 필요"로 출력한다.
# 이건 하드 실패가 아니다 — 걸린 단어는 사람이 보고 판단할 것 (위 경계
# 사례처럼 실제로 괜찮은 경우도 있다).
#
# 판단할 때 기준은 'k=3 이웃 다수결'이 아니라 '화면에 그어지는 선'이다.
# geometry.ts의 LINK_THRESHOLD(0.22)보다 가까운 쌍에만 선이 그어지고,
# 아이는 그 선을 보고 "비슷하구나"라고 읽는다. 이웃 순위상 다른 카테고리가
# 섞여 있어도 그 거리가 임계값 밖이면 화면에는 안 나타난다.
# k=3 검사는 더 엄격한 조기 경보일 뿐이니, 걸리면 실제 연결을 확인하고 판단할 것.

