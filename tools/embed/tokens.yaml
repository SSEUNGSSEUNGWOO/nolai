# 레슨 9용 글 조각 (토큰)
#
# AI는 글을 글자 단위로 읽지 않는다. 자주 쓰는 덩어리는 통째로, 드문 것은
# 잘게 쪼개서 읽고, 조각마다 번호가 붙어 있다. 그 번호가 곧 "AI가 보는 글"이다.
#
# 규칙:
#
# 1. **1조각짜리와 여러 조각짜리를 섞는다.** 이 레슨의 아하는 "자주 쓰는 말일수록
#    적게 쪼개진다"이므로, 대비가 없으면 보여줄 것이 없다.
#      1조각: 안녕하세요, 인공지능, 컴퓨터
#      3조각: 무지개(무|지|개)
#      7조각: 강아지가 공을 물었다
#
# 2. 아이가 아는 말만 쓴다. 조각이 낯설어도 원래 말은 익숙해야 비교가 된다.
#
# 3. 조각과 번호는 손으로 고치지 않는다. build_tokens.py로 다시 만든다.
#    모델이 바뀌면 조각도 바뀌므로 그때마다 문구를 다시 봐야 한다.

